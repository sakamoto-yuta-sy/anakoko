<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>パスワード変更</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        input[type="password"] { display: block; width: 100%; padding: .5rem .75rem; border: 1px solid #ced4da; border-radius: .375rem; }
    </style>
    {% include "shared_styles.html" %}
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4">パスワード変更</h3>
                    <form method="post">
                        {% csrf_token %}
                        {% for error in form.non_field_errors %}
                            <div class="alert alert-danger" role="alert">{{ error }}</div>
                        {% endfor %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                                {{ field }}
                                {% for error in field.errors %}
                                    <div class="text-danger mt-1" role="alert">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}
                        <div class="form-actions d-flex flex-wrap gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">パスワードを変更</button>
                            <a href="{% url 'game_list' %}" class="btn btn-outline-secondary">キャンセル</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
