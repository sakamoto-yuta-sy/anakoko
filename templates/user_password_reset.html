{% extends "user_management_base.html" %}
{% block title %}ユーザーパスワードリセット{% endblock %}
{% block content %}
<h3 class="mb-4">ユーザーパスワードリセット</h3>
<p>対象ユーザーのパスワードを、ユーザー名と同じに変更します。</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-warning">選択したユーザーのパスワードをリセット</button>
</form>
{% endblock %}
